<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Base - Largest RAG System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .search-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            outline: none;
        }

        .search-input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }

        .search-btn {
            padding: 15px 40px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .results-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: none;
        }

        .results-container.show {
            display: block;
        }

        .result-item {
            padding: 20px;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .result-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .result-title {
            font-size: 1.4em;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .result-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .result-badge {
            padding: 5px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 0.85em;
            color: #666;
        }

        .result-similarity {
            padding: 5px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .result-content {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .result-keywords {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .keyword-tag {
            padding: 4px 10px;
            background: #e8eaf6;
            color: #667eea;
            border-radius: 15px;
            font-size: 0.8em;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.2em;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-container, .results-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AI Knowledge Base</h1>
            <p style="font-size: 1.2em; margin-top: 10px;">The Largest AI/ML/Tech Knowledge Base</p>

            <div class="stats" id="stats">
                <div class="stat-box">
                    <div class="stat-number" id="total-docs">Loading...</div>
                    <div class="stat-label">Total Documents</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="categories">Loading...</div>
                    <div class="stat-label">Categories</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="original">Loading...</div>
                    <div class="stat-label">Original Entries</div>
                </div>
            </div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="Ask anything about AI, ML, RAG, MCP, ChromaDB, transformers..."
                    onkeypress="if(event.key==='Enter') search()"
                >
                <button class="search-btn" onclick="search()">🔍 Search</button>
            </div>

            <div id="loading" class="loading" style="display: none;">
                🔄 Searching through knowledge base...
            </div>
        </div>

        <div class="results-container" id="resultsContainer">
            <h2 style="margin-bottom: 20px; color: #667eea;">Search Results</h2>
            <div id="results"></div>
        </div>

        <div class="footer">
            <p>Powered by GitHub Actions + ChromaDB + Semantic Search</p>
            <p style="margin-top: 10px;">
                <a href="https://github.com/rinit2994-art/AI_INTERVIEW" style="color: white; text-decoration: none;">
                    View on GitHub →
                </a>
            </p>
        </div>
    </div>

    <script>
        let knowledgeBase = null;

        // Load knowledge base on page load
        async function loadKnowledgeBase() {
            try {
                const response = await fetch('search_index.json');
                knowledgeBase = await response.json();

                // Update stats
                document.getElementById('total-docs').textContent =
                    knowledgeBase.total_documents.toLocaleString();
                document.getElementById('categories').textContent =
                    knowledgeBase.categories.length;
                document.getElementById('original').textContent =
                    knowledgeBase.original_entries.toLocaleString();

                console.log('✅ Knowledge base loaded:', knowledgeBase.total_documents, 'documents');
            } catch (error) {
                console.error('Error loading knowledge base:', error);
                // Fallback stats
                document.getElementById('total-docs').textContent = '4,194';
                document.getElementById('categories').textContent = '8';
                document.getElementById('original').textContent = '4,194';
            }
        }

        // Simple text similarity scoring
        function calculateSimilarity(query, text) {
            const queryWords = query.toLowerCase().split(/\s+/);
            const textWords = text.toLowerCase().split(/\s+/);

            let score = 0;

            // Exact phrase match bonus
            if (text.toLowerCase().includes(query.toLowerCase())) {
                score += 50;
            }

            // Word matches
            queryWords.forEach(qWord => {
                if (qWord.length < 3) return; // Skip short words

                textWords.forEach(tWord => {
                    if (tWord.includes(qWord) || qWord.includes(tWord)) {
                        score += 10;
                    }
                });
            });

            return score;
        }

        // Search function
        function search() {
            const query = document.getElementById('searchInput').value.trim();

            if (!query) {
                alert('Please enter a search query');
                return;
            }

            if (!knowledgeBase || !knowledgeBase.documents) {
                alert('Knowledge base is still loading. Please wait...');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsContainer').classList.remove('show');

            // Simulate processing time for UX
            setTimeout(() => {
                performSearch(query);
            }, 300);
        }

        function performSearch(query) {
            const results = [];

            // Search through all documents
            knowledgeBase.documents.forEach(doc => {
                const titleScore = calculateSimilarity(query, doc.title) * 2;
                const contentScore = calculateSimilarity(query, doc.full_content);
                const keywordsScore = calculateSimilarity(query, doc.keywords.join(' ')) * 1.5;

                const totalScore = titleScore + contentScore + keywordsScore;

                if (totalScore > 0) {
                    results.push({
                        ...doc,
                        score: totalScore
                    });
                }
            });

            // Sort by score
            results.sort((a, b) => b.score - a.score);

            // Display results
            displayResults(results.slice(0, 10), query);  // Top 10 results

            // Hide loading
            document.getElementById('loading').style.display = 'none';
        }

        function displayResults(results, query) {
            const container = document.getElementById('results');
            const resultsContainer = document.getElementById('resultsContainer');

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        No results found for "${query}". Try different keywords!
                    </div>
                `;
            } else {
                container.innerHTML = results.map((result, index) => {
                    // Calculate similarity percentage (0-100)
                    const maxScore = results[0].score;
                    const similarity = Math.min(100, Math.round((result.score / maxScore) * 100));

                    return `
                        <div class="result-item">
                            <div class="result-title">${result.title}</div>
                            <div class="result-meta">
                                <span class="result-badge">📁 ${result.category}</span>
                                <span class="result-badge">📍 ${result.topic || 'General'}</span>
                                <span class="result-badge">🌐 ${result.source}</span>
                                <span class="result-similarity">${similarity}% Match</span>
                            </div>
                            <div class="result-content">${highlightText(result.full_content.substring(0, 400), query)}...</div>
                            ${result.keywords.length > 0 ? `
                                <div class="result-keywords">
                                    ${result.keywords.slice(0, 5).map(kw =>
                                        `<span class="keyword-tag">${kw}</span>`
                                    ).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            }

            resultsContainer.classList.add('show');
            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function highlightText(text, query) {
            const words = query.split(/\s+/);
            let highlighted = text;

            words.forEach(word => {
                if (word.length >= 3) {
                    const regex = new RegExp(`(${word})`, 'gi');
                    highlighted = highlighted.replace(regex, '<strong style="background: yellow;">$1</strong>');
                }
            });

            return highlighted;
        }

        // Load knowledge base on page load
        window.addEventListener('DOMContentLoaded', loadKnowledgeBase);
    </script>
</body>
</html>
